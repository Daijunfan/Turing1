[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphosat-research"
version = "0.1.0"
description = "Certified morphogenetic polymorphism compilation for Boolean constraints"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
experiments = ["numpy>=2.0", "pandas>=2.0", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["morphosat"]
